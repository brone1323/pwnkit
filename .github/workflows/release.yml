name: Release

on:
  release:
    types: [published]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: corepack enable && corepack prepare pnpm@9 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm publish --provenance --access public
        working-directory: dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Per-platform standalone binaries uploaded as Release assets.
  # Consumed by install.sh, which resolves platform at runtime and
  # downloads the matching asset from the latest release.
  #
  # Runner allocation mirrors binary-build.yml: self-hosted pools for
  # linux-x64 + darwin-arm64, GH-hosted for linux-arm64 + windows-x64.
  # Intel Mac (darwin-x64) is intentionally skipped — GH's macos-13
  # pool is unreliable and Apple stopped shipping Intel Macs in 2022.
  binaries:
    name: binary (${{ matrix.label }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runs_on: '["self-hosted", "Linux", "X64"]'
          - label: linux-arm64
            runs_on: '"ubuntu-24.04-arm"'
          - label: darwin-arm64
            runs_on: '["self-hosted", "macOS", "ARM64", "mini"]'
          - label: windows-x64
            runs_on: '"windows-latest"'
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Clean workspace artifacts (self-hosted runners carry state)
        run: rm -rf dist-bin dist node_modules packages/*/node_modules packages/*/dist
        shell: bash

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: corepack enable && corepack prepare pnpm@9 --activate
        shell: bash

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r build

      - name: Compile standalone binary
        run: bash scripts/bun-compile.sh
        shell: bash

      - name: Rename binary with platform label
        id: rename
        run: |
          cd dist-bin
          if [ -f pwnkit.exe ]; then
            NAME="pwnkit-${{ matrix.label }}.exe"
            mv pwnkit.exe "$NAME"
          else
            NAME="pwnkit-${{ matrix.label }}"
            mv pwnkit "$NAME"
          fi
          echo "asset_name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh
        shell: bash

      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "dist-bin/${{ steps.rename.outputs.asset_name }}" \
            --clobber
        shell: bash

  # Website auto-deploys via Cloudflare Pages Git integration
